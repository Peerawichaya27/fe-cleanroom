services:
  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:5173}
    environment:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:5173}
      API_INTERNAL_URL: ${API_INTERNAL_DOCKER_URL:-http://host.docker.internal:3000/api/v1}
    ports: ["127.0.0.1:5173:5173"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
